name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download UPX
        run: |
          curl -L -o upx.zip https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          tar -xf upx.zip
          move upx-4.2.4-win64\upx.exe .

      - name: Build EXE (UPX compressed)
        run: |
          pyinstaller --onefile --name "销售预测助手" --console --clean --noconfirm --upx-dir=. forecast.py

      - name: Show size
        run: |
          echo "EXE size:"
          dir dist\销售预测助手.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 销售预测助手
          path: dist/销售预测助手.exe

      - name: Create Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/销售预测助手.exe
